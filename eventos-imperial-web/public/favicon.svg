<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#786A8D" />
      <stop offset="100%" stop-color="#4C3F5E" />
    </linearGradient>
    <linearGradient id="emblem" x1="16" y1="14" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9F2" />
    </linearGradient>
  </defs>
  
  <!-- Apple HIG Squircle Base in Royal Plum -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Imperial Crown -->
  <g fill="url(#emblem)">
    <!-- Base band -->
    <rect x="17" y="44" width="30" height="4.5" rx="2.25" />
    
    <!-- Crown Body -->
    <path d="M 18.5 41 L 14.5 25 L 25.5 32 L 32 17.5 L 38.5 32 L 49.5 25 L 45.5 41 Z" />
    
    <!-- Crown Jewels / Orbs -->
    <circle cx="14.5" cy="22" r="2.5" />
    <circle cx="32" cy="14.5" r="3.2" />
    <circle cx="49.5" cy="22" r="2.5" />
  </g>
  
  <!-- Embedded Inset Accents in Plum -->
  <circle cx="32" cy="33.5" r="2.2" fill="#5A4C6E" />
  <circle cx="24.5" cy="37.5" r="1.6" fill="#5A4C6E" />
  <circle cx="39.5" cy="37.5" r="1.6" fill="#5A4C6E" />
</svg>
